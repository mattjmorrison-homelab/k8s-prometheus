apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: homelab
        rules:
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} is down"

          - alert: HighCPU
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU on {{ "{{" }} $labels.instance {{ "}}" }}: {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}%"

          - alert: HighMemory
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory on {{ "{{" }} $labels.instance {{ "}}" }}: {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}%"

          - alert: LowDisk
            expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs",os!="steamos"} / node_filesystem_size_bytes{fstype!="tmpfs",os!="steamos"})) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low disk on {{ "{{" }} $labels.instance {{ "}}" }} ({{ "{{" }} $labels.mountpoint {{ "}}" }}): {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}% used"

          - alert: HighTemp
            expr: node_hwmon_temp_celsius > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High temp on {{ "{{" }} $labels.instance {{ "}}" }}: {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}°C"

          - alert: PiNodeExporterDown
            expr: up{job="pi-node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pi {{ "{{" }} $labels.instance {{ "}}" }} is unreachable"

          - alert: PiUpdatesAvailable
            expr: node_apt_upgrades_pending > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ "{{" }} $labels.pi {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} package update(s) available"

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"

          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{condition="true"} == 0
              and on(pod, namespace)
              kube_pod_status_phase{phase=~"Running|Pending"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is not ready"

          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} unavailable replicas"

          - alert: PVCNotBound
            expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} is {{ "{{" }} $labels.phase {{ "}}" }}"

          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ "{{" }} $labels.node {{ "}}" }} is not ready"

          - alert: PodFailed
            expr: kube_pod_status_phase{phase="Failed"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is in Failed phase"

          - alert: ContainerWaiting
            expr: kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|OOMKilled|CreateContainerError|ImagePullBackOff|ErrImagePull"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Container {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }}/{{ "{{" }} $labels.container {{ "}}" }} is waiting: {{ "{{" }} $labels.reason {{ "}}" }}"

          - alert: ArgoCDAppDegraded
            expr: argocd_app_info{health_status="Degraded"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }}) is Degraded"

          - alert: ArgoCDAppMissing
            expr: argocd_app_info{health_status="Missing"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }}) is Missing"

          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_info{sync_status="OutOfSync"} == 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }}) has been OutOfSync for 10m"

          - alert: OpenBaoSealed
            expr: vault_core_unsealed{cluster!=""} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "OpenBao is sealed"

          - alert: GithubRunnerReconcileErrors
            expr: increase(controller_runtime_reconcile_errors_total{controller="ephemeralrunner"}[10m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "GitHub Actions runner controller has reconcile errors on EphemeralRunner -- a runner may be stuck failing to provision"

          - alert: SlowInternetSpeed
            expr: speedtest_download_bits_per_second > 0 and speedtest_download_bits_per_second < 50000000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Internet download speed is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}bps, below 50Mb/s"
