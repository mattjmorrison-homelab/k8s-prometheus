apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus-alerts/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc:9093

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']

      - job_name: 'argocd'
        static_configs:
          - targets:
              - 'argocd-metrics.argocd.svc:8082'
              - 'argocd-server-metrics.argocd.svc:8083'

      - job_name: 'speedtest-exporter'
        scrape_interval: 5m
        scrape_timeout: 60s
        static_configs:
          - targets: ['speedtest-exporter.monitoring.svc:9798']

      - job_name: 'pi-node-exporter'
        static_configs:
          - targets:
              - 'pizero.local:9100'
              - 'pi1.local:9100'

      - job_name: 'steamos-node-exporter'
        static_configs:
          - targets:
              - 'basementpc.local:9100'
              - 'nevespc.local:9100'
            labels:
              os: steamos

      - job_name: 'macos-node-exporter'
        static_configs:
          - targets:
              - 'Matthews-MacBook-Air.local:9100'
              - 'Nicoles-MacBook-Pro.local:9100'

      - job_name: 'openbao'
        metrics_path: /v1/sys/metrics
        params:
          format: ['prometheus']
        static_configs:
          - targets: ['k8s-openbao.openbao.svc:8200']

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
